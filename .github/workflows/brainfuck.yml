name: brainfuck-selfcheck
on:
  pull_request:
    paths: ["proofs/brainfuck/**"]
permissions:
  contents: read
jobs:
  bf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 proofs/brainfuck/selfcheck.py
