name: CI

on:
  push:
    branches: [ "FaltynIvo", "eleanor-rebuild" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/wrapper-validation@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Shared unit tests + Android debug builds (testnet)
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleEleanorBitcoinTestnetDebug :androidApp:assembleElfallBitcoinTestnetDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eleanor-standalone-testnet-apk
          path: androidApp/build/outputs/apk/eleanorBitcoinTestnet/debug/*.apk

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build Shared framework (iOS simulator arm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --dependency-verification=lenient --console=plain  # TODO regenerate verification metadata on macOS for Kotlin/Native deps, then make strict
      - name: Generate Xcode project
        run: brew install xcodegen && cd iosApp && xcodegen generate
      - name: Build Eleanor.app (simulator, unsigned)
        run: |
          cd iosApp
          xcodebuild -project Eleanor.xcodeproj -scheme Eleanor -sdk iphonesimulator -arch arm64 \
            -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -r "$GITHUB_WORKSPACE/Eleanor-simulator.app.zip" Eleanor.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eleanor-ios-simulator-app
          path: Eleanor-simulator.app.zip

  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r runpod/requirements.lock.txt && python -m pytest -q assistant runpod/tests/test_devnet_config.py
