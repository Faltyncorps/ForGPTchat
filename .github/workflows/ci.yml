name: CI

on:
  push:
    branches: [ "FaltynIvo", "elfall-rebuild" ]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared) + Android debug build (testnet)
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleBitcoinTestnetDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: elfall-testnet-debug-apk
          path: androidApp/build/outputs/apk/bitcoinTestnet/debug/*.apk

  ios-framework:
    runs-on: macos-14
    continue-on-error: true   # iOS side is a skeleton for now
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Link shared framework for iOS simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
