name: Integrity (signed critical constants)

on:
  push:
    branches: [ "eleanor-rebuild", "bankid-sandbox", "FaltynIvo" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Verify manifest hashes, pinned constants and owner signature
        run: python3 scripts/integrity_manifest.py verify
      - name: Unit tests of the integrity checker
        run: pip install "pytest==8.3.5" && python -m pytest -q scripts/tests
