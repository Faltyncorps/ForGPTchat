[package]
name = "elfall-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "ELFALL crypto core: signing-input framing, XChaCha20-Poly1305 vault, Argon2id, Ed25519"
publish = false

[lib]
name = "elfall_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
argon2 = "0.5.3"
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.1.1"
getrandom = "0.2"
uniffi = { version = "=0.29.4", optional = true }
wasm-bindgen = { version = "0.2.128", optional = true }
zeroize = "1.8.2"

[features]
default = []
ffi = ["dep:uniffi"]
bindgen = ["ffi", "uniffi/cli"]
wasm = ["dep:wasm-bindgen", "getrandom/js"]

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = "2.1.1"
hex = "0.4"

[profile.release]
lto = true
panic = "abort"
strip = true
