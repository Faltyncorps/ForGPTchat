name: Eleanor
options:
  xcodeVersion: "15.0"
  bundleIdPrefix: cz.faltyn
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Eleanor:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Eleanor
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "Face ID chrání vaši peněženku / Face ID protects your wallet seed."
        NSCameraUsageDescription: "Skenování QR adres / Scan payment QR codes."
        ELEANOR_STANDALONE: true
        CFBundleURLTypes:
          - CFBundleURLName: cz.faltyn.elfall.bankid
            CFBundleURLSchemes: [ "elfall" ]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.faltyn.eleanor.testnet
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework $(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
        OTHER_LDFLAGS: "-framework Shared -lc++"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
